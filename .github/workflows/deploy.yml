name: Deploy ingest (Cloudflare)

on:
    push:
        branches: [master]

concurrency:
    group: deploy-ingest-cloudflare-${{ github.ref }}
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: yarn

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Deploy Workers
              working-directory: apps/ingest-cloudflare
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
              run: yarn deploy:all
