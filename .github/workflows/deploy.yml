name: Deploy

on:
  push:
    branches: [master]

concurrency:
  group: deploy-ingest-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ingest: ${{ steps.filter.outputs.ingest }}
      categoriser: ${{ steps.filter.outputs.categoriser }}
      migrations: ${{ steps.filter.outputs.migrations }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ingest:
              - 'apps/ingest-cloudflare/**'
              - 'libs/ingest-core/**'
              - 'package.json'
              - 'yarn.lock'
            categoriser:
              - 'apps/categorise-cloudflare/**'
              - 'libs/categoriser/**'
              - 'package.json'
              - 'yarn.lock'
            migrations:
              - 'supabase/migrations/**'
            workflow:
              - '.github/workflows/deploy.yml'

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Verify workers and libraries
        run: |
          yarn workspace @investments/ingest-cloudflare run types
          yarn workspace @investments/ingest-cloudflare test
          yarn workspace @investments/ingest-core test
          yarn workspace @investments/categorise-cloudflare test
          yarn workspace @investments/categorise-cloudflare run types
          yarn workspace @investments/source-rpc test

  migrate:
    needs: [changes, verify]
    if: ${{ !failure() && !cancelled() && (needs.changes.outputs.migrations == 'true' || needs.changes.outputs.workflow == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref irykogsfzzoexmnnthgc -p "$SUPABASE_DB_PASSWORD"
      - name: Push Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --include-all -p "$SUPABASE_DB_PASSWORD"

  infra:
    needs: [changes, verify, migrate]
    if: ${{ !failure() && !cancelled() && (needs.changes.outputs.ingest == 'true' || needs.changes.outputs.workflow == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Ensure Cloudflare queues
        working-directory: apps/ingest-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-queues.mjs

  deploy-ingest:
    needs: [changes, verify, migrate, infra]
    if: ${{ !failure() && !cancelled() && (needs.changes.outputs.ingest == 'true' || needs.changes.outputs.workflow == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Deploy ingest Worker
        working-directory: apps/ingest-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: yarn deploy:ingest

  deploy-consumer:
    needs: [changes, verify, migrate, infra]
    if: ${{ !failure() && !cancelled() && (needs.changes.outputs.ingest == 'true' || needs.changes.outputs.workflow == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Deploy consumer Worker
        working-directory: apps/ingest-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: yarn deploy:consumer

  deploy-categoriser:
    needs: [changes, verify, migrate]
    if: ${{ !failure() && !cancelled() && (needs.changes.outputs.categoriser == 'true' || needs.changes.outputs.workflow == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Deploy categoriser Worker
        working-directory: apps/categorise-cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: yarn deploy
