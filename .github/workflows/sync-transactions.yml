name: Sync 22seven Transactions

on:
    schedule:
        - cron: "0 2 * * *"

    workflow_dispatch:

jobs:
    build-and-sync:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20" # Use Node 20

            - name: Install dependencies
              run: yarn install

            - name: Run Transaction Sync
              env:
                  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
                  MY_22SEVEN_USERNAME: ${{ secrets.MY_22SEVEN_USERNAME }}
                  MY_22SEVEN_PASSWORD: ${{ secrets.MY_22SEVEN_PASSWORD }}
              run: yarn tsx apps/src/functions/syncTransactions.ts
