# Queue consumer: load R2 objects, finalize payload, parse XLSX, Finwise, Supabase DLQ.
name = "investments-ingest-consumer"
main = "src/consumer.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
# Required when SUPABASE_URL / BANK_ZERO_* live only in the dashboard (see docs).
keep_vars = true

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[[r2_buckets]]
binding = "INGEST_BUCKET"
bucket_name = "investments-ingest"

[[queues.consumers]]
queue = "investments-email-ingest"
max_batch_size = 1
max_batch_timeout = 2
max_retries = 5

[[queues.producers]]
binding = "JOBS_QUEUE"
queue = "investments-jobs"

[[queues.consumers]]
queue = "investments-jobs"
max_batch_size = 1
max_batch_timeout = 1
max_retries = 3

# 07:00 UTC is 09:00 in Johannesburg, after the previous ISMRT usage day has closed.
# The cron only enqueues jobs onto investments-jobs; each job has its own 50-subrequest
# budget on the Cloudflare free plan.
[triggers]
crons = ["0 7 * * *"]

# Dashboard secrets: FINWISE_API_KEY, SUPABASE_*, BANK_ZERO_*.
# Tuya secrets: TUYA_ACCESS_ID, TUYA_ACCESS_SECRET.
# Optional: GEMINI_API_KEY when CATEGORISATION_ENABLED=true (batched Gemini for uncategorized rows).
# (Workers → investments-ingest-consumer → Settings → Variables and secrets). Omitting them here
# avoids `wrangler deploy` replacing your dashboard values with empty defaults.
[vars]
FINWISE_BASE_URL = "https://api.finwiseapp.io"
UPLOAD_TO_FINWISE = "true"
TUYA_DEVICE_ID = "bf425b172390340134huph"
