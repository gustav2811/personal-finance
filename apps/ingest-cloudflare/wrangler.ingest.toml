# HTTP ingest: validate SendGrid POST, write attachments to R2, enqueue job.
# Prerequisites: create queue `investments-email-ingest` and R2 bucket `investments-ingest` (or override names below).
name = "investments-ingest"
main = "src/ingest.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
# Preserve plain-text vars set in the dashboard (Wrangler’s default is to delete unlisted vars).
keep_vars = true

# The shared automation receiver currently enables Gustav's mailbox evidence.
# Cara's deliveries remain captured and marked unverified until her baseline is
# explicitly enabled.
[vars]
INGEST_OWNER_PROFILES = "gustav"

[observability]
[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[[r2_buckets]]
binding = "INGEST_BUCKET"
bucket_name = "investments-ingest"

[[queues.producers]]
binding = "INGEST_QUEUE"
queue = "investments-email-ingest"

# Secret: INGEST_TOKEN, SENTRY_DSN.
