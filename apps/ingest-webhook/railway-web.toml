# Railway config-as-code: Web service (Fastify HTTP + webhook).
# Use this as the custom config path for the web service only.
# Root Directory on Railway must be repo root so libs/finwise is available.

[build]
builder = "railpack"
buildCommand = "cd apps/ingest-webhook && yarn install --frozen-lockfile"

[deploy]
startCommand = "cd apps/ingest-webhook && yarn start"
healthcheckPath = "/"
healthcheckTimeout = 100
